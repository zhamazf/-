<!--
  ═══════════════════════════════════════════════════════════════
  Content Security Policy
  - default-src 'self'           → كل شيء من نفس الدومين فقط
  - script-src                   → gstatic (Firebase CDN) + 'unsafe-inline' (لوجود سكربتات inline صغيرة؛
                                   الحماية من XSS تعتمد على عدم استخدام innerHTML مع بيانات المستخدم)
  - connect-src                  → Firebase Realtime DB + Auth endpoints
  - style-src 'unsafe-inline'    → مطلوب للـ inline styles (شاشة التحميل)
  - img-src / media-src          → data: blob: + Firebase Storage + صور حسابات Google فقط
                                   (أي رابط خارجي آخر محجوب: يمنع تتبّع IP المستخدم عبر رسائل فيها روابط)
   إذا أضفت دومينات خارجية لاحقاً (fonts, cdn...) أضفها هنا
  ═══════════════════════════════════════════════════════════════
-->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com;
  connect-src 'self'
    https://*.firebaseio.com
    wss://*.firebaseio.com
    https://*.googleapis.com
    https://identitytoolkit.googleapis.com
    https://securetoken.googleapis.com;
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: blob: https://firebasestorage.googleapis.com https://*.googleusercontent.com;
  font-src 'self' data:;
  media-src 'self' blob: data: https://firebasestorage.googleapis.com;
  worker-src 'self' blob:;
  frame-src https://nabda-chat.firebaseapp.com https://accounts.google.com;
  object-src 'none';
  base-uri 'self';
  form-action 'self';
"/>

<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon.png"/>
<link rel="apple-touch-icon" href="icon.png"/>

<style>
#loading-screen{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:16px;
  transition:opacity .4s ease;
}
#loading-screen.hide{
  opacity:0;
  pointer-events:none;
}
#loading-error{
  display:none;
  color:#ef4444;
  font-size:14px;
  text-align:center;
  max-width:280px;
  line-height:1.6;
}
#loading-error.show{
  display:block;
}
#app{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
</style>

<!-- تطبيق الثيم فوراً قبل الرندر لمنع الوميض -->
<script>
(function(){
  try{
    var dark = JSON.parse(localStorage.getItem('nabda_theme'));
    if(dark === null) dark = window.matchMedia('(prefers-color-scheme:dark)').matches;
    var bg = dark
      ? 'linear-gradient(160deg,#0e1621,#17212b)'
      : 'linear-gradient(160deg,#f0f4ff,#e8eeff)';
    // استخدام style element بدل document.write
    var s = document.createElement('style');
    s.textContent = '#loading-screen{background:' + bg + '}';
    document.head.appendChild(s);
  }catch(e){}
})();
</script>
</head>
<body>

<!-- شاشة التحميل — تختفي فقط بعد FB.init() + تحميل البيانات الأساسية -->
<div id="loading-screen">
  <div style="width:64px;height:64px;background:linear-gradient(135deg,#3b9ef0,#2b7fd4);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 8px 24px rgba(99,102,241,.35)"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
  <div id="ls-title" style="font-size:22px;font-weight:800;letter-spacing:-0.5px">نبضة</div>
  <div id="ls-spinner" style="width:36px;height:36px;border:3px solid #3b9ef0;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite"></div>
  <!-- رسالة الخطأ — تظهر فقط عند فشل التحميل -->
  <div id="loading-error">
    <div style="font-size:24px;margin-bottom:8px"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg></div>
    <span id="loading-error-msg">تعذر تحميل التطبيق</span>
    <br/>
    <button
      onclick="location.reload()"
      style="margin-top:12px;padding:8px 20px;background:#3b9ef0;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px">
      إعادة المحاولة
    </button>
  </div>
</div>

<!-- جذر التطبيق -->
<div id="app"></div>
<div id="toast-host"></div>

<!--
  ═══════════════════════════════════════════════
  ترتيب السكربتات (مهم جداً)
  1. firebase.js  → window.FB
  2. auth.js      → window.Auth
  3. chat.js      → window.Chat
  4. friends.js   → window.Friends
  5. groups.js    → window.Groups
  6. stories.js   → window.Stories
  7. ui.js        → window.UI
  8. app.js       → التطبيق الرئيسي
  ═══════════════════════════════════════════════
-->
<script>
// تحميل السكربتات بالترتيب مع معالجة الأخطاء
(function(){
  var scripts = [
    'firebase.js',
    'auth.js',
    'e2e.js',
    'chat.js',
    'friends.js',
    'groups.js',
    'stories.js',
    'ui.js',
    'app.js'
  ];

  function showLoadError(filename) {
    var spinner = document.getElementById('ls-spinner');
    var errBox  = document.getElementById('loading-error');
    var errMsg  = document.getElementById('loading-error-msg');
    if(spinner) spinner.style.display = 'none';
    if(errMsg)  errMsg.textContent = 'فشل تحميل الملف: ' + filename + '\nتأكد من اتصال الإنترنت وأعد المحاولة.';
    if(errBox)  errBox.classList.add('show');
  }

  function loadNext(index) {
    if(index >= scripts.length) return; // كلها حُملت

    var s = document.createElement('script');
    s.src = scripts[index];

    // app.js الأخير — defer غير ضروري لأننا نتحكم بالترتيب يدوياً
    s.async = false;

    s.onerror = function() {
      showLoadError(scripts[index]);
      // ⚠️ نوقف التحميل — لا فائدة من بقية الملفات إذا فشل أحدها
    };

    s.onload = function() {
      loadNext(index + 1);
    };

    document.body.appendChild(s);
  }

  loadNext(0);
})();
</script>

<!-- ── Service Worker registration + update detection ── -->
<script>
(function(){
  if (!('serviceWorker' in navigator)) return;

  navigator.serviceWorker.addEventListener('message', function(e) {
    if (!e.data) return;

    // (تم إلغاء إشعار "يوجد تحديث": التحديث يظهر تلقائياً عند فتح التطبيق)

    // تم مسح الـ cache
    if (e.data.type === 'CACHE_CLEARED') {
      location.reload();
    }
  });

  // دالة مساعدة عالمية لمسح الـ cache
  window.clearAppCache = function() {
    if (navigator.serviceWorker.controller) {
      navigator.serviceWorker.controller.postMessage({ type: 'CLEAR_CACHE' });
    } else {
      caches.keys().then(function(keys) {
        return Promise.all(keys.map(function(k){ return caches.delete(k); }));
      }).then(function(){ location.reload(); });
    }
  };
})();
</script>
</body>
</html>
