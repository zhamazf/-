<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#6366f1"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="نبضة"/>

<!--
  ═══════════════════════════════════════════════════════════════
  Content Security Policy
  - default-src 'self'           → كل شيء من نفس الدومين فقط
  - script-src                   → السماح لـ gstatic (Firebase CDN) + inline scripts (nonce مطلوب)
  - connect-src                  → Firebase Realtime DB + Auth endpoints
  - style-src 'unsafe-inline'    → مطلوب للـ inline styles (شاشة التحميل)
  - img-src data: blob:          → للصور المحلية
  ⚠️ إذا أضفت دومينات خارجية لاحقاً (fonts, cdn...) أضفها هنا
  ═══════════════════════════════════════════════════════════════
-->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline' https://www.gstatic.com;
  connect-src 'self'
    https://*.firebaseio.com
    wss://*.firebaseio.com
    https://*.googleapis.com
    https://identitytoolkit.googleapis.com
    https://securetoken.googleapis.com;
  style-src 'self' 'unsafe-inline';
  img-src 'self' data: blob: https:;
  font-src 'self' data:;
  media-src 'self' blob:;
  worker-src 'self' blob:;
  frame-src 'none';
  object-src 'none';
  base-uri 'self';
  form-action 'self';
"/>

<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon.png"/>
<link rel="apple-touch-icon" href="icon.png"/>
<title>نبضة Chat</title>
<link rel="preconnect" href="https://www.gstatic.com"/>
<link rel="preconnect" href="https://nabda-chat-default-rtdb.firebaseio.com"/>
<link rel="stylesheet" href="style.css"/>
<style>
#loading-screen{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:16px;
  transition:opacity .4s ease;
}
#loading-screen.hide{
  opacity:0;
  pointer-events:none;
}
#loading-error{
  display:none;
  color:#ef4444;
  font-size:14px;
  text-align:center;
  max-width:280px;
  line-height:1.6;
}
#loading-error.show{
  display:block;
}
#app{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
</style>

<!-- تطبيق الثيم فوراً قبل الرندر لمنع الوميض -->
<script>
(function(){
  try{
    var dark = JSON.parse(localStorage.getItem('nabda_theme'));
    if(dark === null) dark = window.matchMedia('(prefers-color-scheme:dark)').matches;
    var bg = dark
      ? 'linear-gradient(160deg,#0a0a14,#0d0d1a)'
      : 'linear-gradient(160deg,#f0f4ff,#e8eeff)';
    // استخدام style element بدل document.write
    var s = document.createElement('style');
    s.textContent = '#loading-screen{background:' + bg + '}';
    document.head.appendChild(s);
  }catch(e){}
})();
</script>
</head>
<body>

<!-- شاشة التحميل — تختفي فقط بعد FB.init() + تحميل البيانات الأساسية -->
<div id="loading-screen">
  <div style="width:64px;height:64px;background:linear-gradient(135deg,#6366f1,#8b5cf6);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 8px 24px rgba(99,102,241,.35)">💬</div>
  <div id="ls-title" style="font-size:22px;font-weight:800;letter-spacing:-0.5px">نبضة</div>
  <div id="ls-spinner" style="width:36px;height:36px;border:3px solid #6366f1;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite"></div>
  <!-- رسالة الخطأ — تظهر فقط عند فشل التحميل -->
  <div id="loading-error">
    <div style="font-size:24px;margin-bottom:8px">⚠️</div>
    <span id="loading-error-msg">تعذر تحميل التطبيق</span>
    <br/>
    <button
      onclick="location.reload()"
      style="margin-top:12px;padding:8px 20px;background:#6366f1;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px">
      إعادة المحاولة
    </button>
  </div>
</div>

<!-- جذر التطبيق -->
<div id="app"></div>
<div id="toast-host"></div>

<!--
  ═══════════════════════════════════════════════
  ترتيب السكربتات (مهم جداً)
  1. firebase.js  → window.FB
  2. auth.js      → window.Auth
  3. chat.js      → window.Chat
  4. friends.js   → window.Friends
  5. groups.js    → window.Groups
  6. stories.js   → window.Stories
  7. ui.js        → window.UI
  8. app.js       → التطبيق الرئيسي
  ═══════════════════════════════════════════════
-->
<script>
// تحميل السكربتات بالترتيب مع معالجة الأخطاء
(function(){
  var scripts = [
    'firebase.js',
    'auth.js',
    'chat.js',
    'friends.js',
    'groups.js',
    'stories.js',
    'ui.js',
    'app.js'
  ];

  function showLoadError(filename) {
    var spinner = document.getElementById('ls-spinner');
    var errBox  = document.getElementById('loading-error');
    var errMsg  = document.getElementById('loading-error-msg');
    if(spinner) spinner.style.display = 'none';
    if(errMsg)  errMsg.textContent = 'فشل تحميل الملف: ' + filename + '\nتأكد من اتصال الإنترنت وأعد المحاولة.';
    if(errBox)  errBox.classList.add('show');
  }

  function loadNext(index) {
    if(index >= scripts.length) return; // كلها حُملت

    var s = document.createElement('script');
    s.src = scripts[index];

    // app.js الأخير — defer غير ضروري لأننا نتحكم بالترتيب يدوياً
    s.async = false;

    s.onerror = function() {
      showLoadError(scripts[index]);
      // ⚠️ نوقف التحميل — لا فائدة من بقية الملفات إذا فشل أحدها
    };

    s.onload = function() {
      loadNext(index + 1);
    };

    document.body.appendChild(s);
  }

  loadNext(0);
})();
</script>

</body>
</html>
