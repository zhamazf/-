<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#6366f1"/>
<title>الصفحة غير موجودة — نبضة</title>
<style>
  :root{ --bg:#f0f2f5; --card:#ffffff; --border:#e5e7eb; --text:#1f2937; --text2:#6b7280; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0a0a14; --card:#12121e; --border:#1e1e30; --text:#e0e0f0; --text2:#a1a1b5; }
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);color:var(--text);
    font-family:"Tajawal","Segoe UI",system-ui,sans-serif;
    padding:20px;text-align:center;
  }
  .icon{
    width:88px;height:88px;border-radius:24px;margin:0 auto 20px;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    display:flex;align-items:center;justify-content:center;font-size:44px;
    box-shadow:0 8px 24px rgba(99,102,241,.35);
  }
  h1{font-size:64px;font-weight:800;margin:0 0 6px;letter-spacing:-1px}
  p{font-size:15px;color:var(--text2);margin:0 0 26px;line-height:1.7}
  a.btn{
    display:inline-block;padding:12px 28px;border-radius:14px;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;
    font-weight:700;font-size:14px;text-decoration:none;
    box-shadow:0 4px 14px rgba(99,102,241,.4);
  }
</style>
</head>
<body>
  <div>
    <div class="icon">💬</div>
    <h1>404</h1>
    <p>هذه الصفحة غير موجودة، أو ربما انتقلت لمكان آخر.</p>
    <a class="btn" href="/">← الرجوع إلى نبضة</a>
  </div>
</body>
</html>
